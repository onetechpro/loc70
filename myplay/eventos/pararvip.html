    <style>
        :root{
            --p-blue:#0064FF;
            --p-blue-dark:#0047B3;
            --p-blue-light:#4D93FF;
            --p-bg:#000;
            --p-text:#FFF;
            --p-text-muted:#B8C4D9;
        }
        *,*::before,*::after{box-sizing:border-box}
        html,body{
            margin:0;padding:0;width:100%;height:100%;
            background:var(--p-bg);overflow:hidden;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
            color:var(--p-text);
            -webkit-font-smoothing:antialiased;
            text-rendering:optimizeSpeed;
        }
        #player{width:100%;height:100%}

        .player-ui .level-selector-container{
            background:rgba(0,100,255,.85);border-radius:6px;padding:6px 10px;
            backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
        }
        .player-ui .level-selector-container ul li{
            padding:6px 16px;font-size:14px;color:#fff;
        }
        .player-ui .level-selector-container ul li.active{
            background:rgba(255,255,255,.22);font-weight:700;
        }

        #aviso-overlay{
            position:fixed;inset:0;display:none;align-items:center;justify-content:center;
            background:
                radial-gradient(120% 90% at 50% 0%,rgba(0,100,255,.25) 0%,rgba(0,0,0,.95) 60%),
                #000;
            z-index:9999;text-align:center;
            padding:clamp(16px,4vw,40px);
            contain:layout style paint;
        }
        #aviso-overlay.ativo{display:flex;animation:fadeIn .3s ease both}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}

        .aviso-box{
            width:100%;max-width:560px;
            padding:clamp(20px,4vw,40px) clamp(18px,4vw,36px);
            background:rgba(10,16,30,.75);
            border:1px solid rgba(0,100,255,.35);
            border-radius:16px;
            box-shadow:0 20px 60px rgba(0,100,255,.15),0 0 0 1px rgba(255,255,255,.03) inset;
            backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
        }

        .aviso-box .icone{
            width:clamp(56px,12vw,76px);
            height:clamp(56px,12vw,76px);
            margin:0 auto 18px;
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius:50%;
            background:linear-gradient(135deg,var(--p-blue) 0%,var(--p-blue-dark) 100%);
            color:#fff;
            font-size:clamp(28px,6vw,38px);
            font-weight:800;
            box-shadow:0 10px 30px rgba(0,100,255,.45);
        }

        .aviso-box h2{
            color:var(--p-text);font-size:clamp(18px,4.5vw,26px);line-height:1.25;
            margin:0 0 12px;font-weight:800;letter-spacing:-.2px;
        }
        .aviso-box p{
            color:var(--p-text-muted);font-size:clamp(13px,3.6vw,16px);
            margin:0 0 clamp(20px,4vw,28px);line-height:1.55;
        }
        .aviso-box a.botao{
            display:inline-block;width:100%;max-width:320px;
            padding:clamp(13px,3vw,16px) clamp(20px,4vw,32px);
            background:linear-gradient(135deg,var(--p-blue) 0%,var(--p-blue-dark) 100%);
            color:#fff;text-decoration:none;font-weight:800;
            font-size:clamp(13px,3.4vw,15px);letter-spacing:1.4px;
            border-radius:999px;
            transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;
            box-shadow:0 8px 24px rgba(0,100,255,.45);
        }
        .aviso-box a.botao:hover{transform:translateY(-2px);filter:brightness(1.08);
            box-shadow:0 14px 32px rgba(0,100,255,.6)}
        .aviso-box a.botao:active{transform:translateY(0)}

        @media (max-width:420px){.aviso-box{border-radius:12px}
            .aviso-box a.botao{letter-spacing:1px}}
        @media (max-height:480px){
            .aviso-box .icone{width:48px;height:48px;font-size:22px;margin-bottom:10px}
            .aviso-box p{margin-bottom:16px}
        }

        #aviso-overlay:not(.ativo){visibility:hidden}
        #aviso-overlay.ativo{visibility:visible}
	    #histats_counter {
	      display: none;
